<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Discos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
        }
        .checkbox-group input {
            width: auto;
            margin-right: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Formulario de Discos</h1>
    <form id="discoForm">
        <div class="form-group">
            <label for="nombre">Nombre del disco:</label>
            <input type="text" id="nombre" name="nombre" maxlength="100">
        </div>

        <div class="form-group">
            <label for="grupo">Grupo de música o cantante:</label>
            <input type="text" id="grupo" name="grupo" maxlength="100">
        </div>

        <div class="form-group">
            <label for="anio">Año de publicación:</label>
            <input type="number" id="anio" name="anio" min="1900" max="2024">
        </div>

        <div class="form-group">
            <label for="tipo">Tipo de música:</label>
            <select id="tipo" name="tipo">
                <option value="rock">Rock</option>
                <option value="pop">Pop</option>
                <option value="punk">Punk</option>
                <option value="indie">Indie</option>
            </select>
        </div>

        <div class="form-group">
            <label for="localizacion">Localización (número de estantería):</label>
            <input type="number" id="localizacion" name="localizacion" min="0">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="prestado" name="prestado" value="true">
            <label for="prestado">¿Prestado?</label>
        </div>

        <button type="submit">Guardar Disco</button>
    </form>

    <div id="resultado"></div>

    <script>
        // Clase Disco (la misma que en t4e4)
        class Disco {
            constructor(nombre = "", grupo = "", año = "", tipo = "", localizacion = 0, prestado = false) {
                this.nombre = nombre;
                this.grupo = grupo;
                this.año = año;
                this.tipo = tipo;
                this.localizacion = localizacion;
                this.prestado = prestado;
            }
            
            static crearConParametros(nombre, grupo, año, tipo, localizacion) {
                return new Disco(nombre, grupo, año, tipo, localizacion, false);
            }
            
            cambiarLocalizacion(nuevaLocalizacion) {
                this.localizacion = nuevaLocalizacion;
            }
            
            cambiarPrestado(estado) {
                this.prestado = estado;
            }
            
            mostrarInfo() {
                return `Nombre: ${this.nombre}<br>Grupo: ${this.grupo}<br>Año: ${this.año}<br>Tipo: ${this.tipo}<br>Localización: ${this.localizacion}<br>Prestado: ${this.prestado ? 'Sí' : 'No'}`;
            }
        }

        
        let discos = [];

      
        function inicializarDiscos() {
            if (discos.length === 0) {
                discos.push(Disco.crearConParametros("The Dark Side of the Moon", "Pink Floyd", "1973", "rock", 1));
                discos.push(Disco.crearConParametros("Thriller", "Michael Jackson", "1982", "pop", 2));
                discos.push(Disco.crearConParametros("Nevermind", "Nirvana", "1991", "rock", 3));
            }
        }

    
        function mostrarDiscos() {
            const resultado = document.getElementById('resultado');
            if (discos.length === 0) {
                resultado.innerHTML = '<p>No hay discos registrados.</p>';
                return;
            }
            
            let html = '<h2>Discos Registrados:</h2>';
            discos.forEach((disco, index) => {
                html += `<div style="border:1px solid #ddd; padding:10px; margin-bottom:10px;">
                    <strong>${disco.nombre}</strong> - ${disco.grupo} (${disco.año})<br>
                    Tipo: ${disco.tipo} | Estantería: ${disco.localizacion} | Prestado: ${disco.prestado ? 'Sí' : 'No'}
                </div>`;
            });
            resultado.innerHTML = html;
        }

        document.getElementById('discoForm').addEventListener('submit', function(event) {
            event.preventDefault();          

            const nombre = document.getElementById('nombre').value;
            const grupo = document.getElementById('grupo').value;
            const anio = document.getElementById('anio').value;
            const tipo = document.getElementById('tipo').value;
            const localizacion = parseInt(document.getElementById('localizacion').value) || 0;
            const prestado = document.getElementById('prestado').checked;

            const nuevoDisco = new Disco(nombre, grupo, anio, tipo, localizacion, prestado);
            
            discos.push(nuevoDisco);

            alert(`Disco "${nombre}" agregado correctamente.`);

            mostrarDiscos();

            this.reset();
            document.getElementById('prestado').checked = false;
        });

        window.onload = function() {
            inicializarDiscos();
            mostrarDiscos();
        };
    </script>
</body>
</html>
